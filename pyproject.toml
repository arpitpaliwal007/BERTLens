[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bertlens"
version = "0.1.0"
description = "Reproducible BERT representation analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["datasets>=3.0", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "torch>=2.2", "transformers>=4.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
bertlens = "bert_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
